; Shorts Bot settings. Copy this file to "config.ini" (or just use the Settings tab in the app,
; which writes config.ini for you). NEVER commit config.ini: it contains your Telegram bot token.

[youtube]
; Leave empty if you connect YouTube with the official login (recommended).
; Only needed for the old cookie-based mode.
channel_id =
; file / firefox / edge / chrome  (only used when YouTube is not connected)
cookie_source = file
; Make private videos "unlisted" so they can be downloaded without cookies
make_unlisted = yes
; Permanently delete videos from YouTube N days after they were sent (OFF by default!)
delete_from_youtube = no
delete_after_days = 7
; Only videos whose title contains this text are processed
title_filter = Grand Theft Auto
latest = 10

[telegram]
; Create a bot with @BotFather on Telegram and paste its token here
token =
; Your chat id (the app has a "Find chat ID" button)
chat_id =

[app]
auto_minutes = 10
summary_time = 22:00

[video]
; blur = whole picture on a blurred background, crop = fill the screen. Can be "blur,crop"
styles = blur
; original / lowered / muted / both
audio = original
length = 59
slowmo = no
sharpen = yes
action_high = no
watermark =
prefix = GTA6
cleanup_days = 14
multi_shorts = yes
max_shorts = 3
normalize = yes
cover = yes
